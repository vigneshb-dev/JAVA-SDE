# ==============================================================================
# OrderFlow - Spring Boot Application Configuration
# ==============================================================================

# Application Identity & Port
spring.application.name=orderflow-backend
server.port=8080

# ------------------------------------------------------------------------------
# DATASOURCE (HikariCP Connection Pool)
# ------------------------------------------------------------------------------
# Default targets local PostgreSQL. In testing or when PostgreSQL is unavailable,
# Spring Boot can use in-memory H2 automatically.
spring.datasource.url=jdbc:postgresql://localhost:5432/orderflow
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Sizing
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=OrderFlow-Spring-HikariPool

# ------------------------------------------------------------------------------
# JPA & HIBERNATE CONFIGURATION
# ------------------------------------------------------------------------------
# ddl-auto modes:
#   - none: Do not touch database schema (Best practice for production with Flyway/Liquibase).
#   - validate: Verify tables and column types match entities, fail startup if mismatched.
#   - update: Auto-add missing tables/columns without dropping data.
#   - create-drop: Create schema on startup, drop everything on shutdown (Useful for tests).
spring.jpa.hibernate.ddl-auto=update

# Show SQL: Prints raw SQL statements to console
spring.jpa.show-sql=true

# Format SQL: Pretty-prints multi-line indented SQL for human readability
spring.jpa.properties.hibernate.format_sql=true

# Show Parameter Bindings (Trace Hibernate ? values)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Do not open database connection per view (Anti-pattern: Open Session in View)
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# CUSTOM APPLICATION PROPERTIES (@ConfigurationProperties)
# ------------------------------------------------------------------------------
orderflow.store-name=OrderFlow Flagship Store
orderflow.default-currency=USD
orderflow.max-items-per-order=50
orderflow.inventory.low-stock-threshold=5
