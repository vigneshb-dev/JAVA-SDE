# Development & Testing Profile using In-Memory H2 in PostgreSQL Mode
spring.datasource.url=jdbc:h2:mem:orderflow_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

orderflow.store-name=OrderFlow Dev Store
orderflow.default-currency=USD
orderflow.max-items-per-order=50
# Spring Cache Strategy for Dev: Simple In-Memory (Zero External Dependencies)
spring.cache.type=simple

# Apache Kafka Strategy for Dev / Offline Testing (Zero External Dependencies)
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
orderflow.outbox.poll-interval-ms=60000
